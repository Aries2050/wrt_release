name: Build WRT
run-name: Build - ${{ inputs.model }}${{ inputs.build_mode != '' && format(' ({0})', inputs.build_mode) || '' }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: jdcloud_ipq60xx_immwrt
        options:
          - jdcloud_ipq60xx_immwrt
          - link_nn6000v2_immwrt
      build_mode:
        required: false
        description: Build mode (empty=full, debug, container, container_debug, config_preview)
        type: choice
        default: ""
        options:
          - ""
          - debug
          - container
          - container_debug
          - config_preview
      add_fragments:
        required: false
        description: Add config fragments, comma separated
        default: ""
      remove_fragments:
        required: false
        description: Remove default config fragments, comma separated
        default: ""

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    outputs:
      build_date: ${{ env.BUILD_DATE }}
      firmware_files: ${{ steps.list-firmware.outputs.files }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo -E apt-get autoremove --purge -y || true
          sudo -E apt-get clean || true
          df -hT

      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev binutils 7zip
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set Build Date and Timezone
        env:
          RAW_ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          RAW_REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: |
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          sanitize_cache_key_part() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.-' '_'; }
          echo "ADD_CONFIG_FRAGMENTS_KEY=$(sanitize_cache_key_part "$RAW_ADD_CONFIG_FRAGMENTS")" >> $GITHUB_ENV
          echo "REMOVE_CONFIG_FRAGMENTS_KEY=$(sanitize_cache_key_part "$RAW_REMOVE_CONFIG_FRAGMENTS")" >> $GITHUB_ENV

      - name: Pre Clone
        run: ./wrt_core/pre_clone_action.sh ${{ inputs.model }}

      - name: Pre-build Check — Prebuilt Packages
        run: |
          ERRORS=0
          echo "============================================"
          echo "  Pre-build 检查"
          echo "  模型: ${{ inputs.model }}"
          echo "============================================"
          echo "■ [预编译包]"
          PREBUILT_COUNT=$(ls -1 ./wrt_core/prebuilt_packages/pkgs/*.ipk ./wrt_core/prebuilt_packages/pkgs/*.apk 2>/dev/null | wc -l)
          if [ "$PREBUILT_COUNT" -gt 0 ]; then
            echo "  ✅ $PREBUILT_COUNT 个预编译 IPK/APK 可用"
          else
            echo "  ❌ 无预编译包（若模型依赖预编译包，构建会失败）"
            ERRORS=$((ERRORS + 1))
          fi
          if [ $ERRORS -gt 0 ]; then
            echo "结果: ❌ $ERRORS 项检查未通过，终止构建"
            exit 1
          fi
          echo "结果: ✅ 所有预检查通过"

      - name: Load Config Flag
        run: |
          if [ -f "./config_flag" ]; then
            CONFIG_FLAG=$(cat ./config_flag)
            echo "当前配置指纹: ${CONFIG_FLAG}"
          else
            echo "Warning: config_flag not found"
            echo "unknown" > ./config_flag
          fi

      - name: Cache Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}-${{ hashFiles('**/config_flag') }}-${{ env.ADD_CONFIG_FRAGMENTS_KEY }}-${{ env.REMOVE_CONFIG_FRAGMENTS_KEY }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}-${{ hashFiles('**/config_flag') }}-
            ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}-

      - name: Detect Config Change and Clear Incompatible Cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            STORED_FLAG=""
            if [ -f "./action_build/.config_flag" ]; then
              STORED_FLAG=$(cat ./action_build/.config_flag)
            fi
            CURRENT_FLAG="$(cat ./config_flag 2>/dev/null || echo 'unknown')"
            if [ "${STORED_FLAG}" != "${CURRENT_FLAG}" ]; then
              echo "配置已变更: '${STORED_FLAG:-<无>}' -> '${CURRENT_FLAG}'"
              echo "清除不兼容的 staging_dir..."
              rm -rf ./action_build/staging_dir
            else
              echo "配置未变，保留缓存。"
            fi
          else
            echo "未找到 staging_dir（未命中缓存），跳过配置检查。"
          fi

      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            cp -f ./config_flag ./action_build/.config_flag
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Machine Information (Pre-build)
        run: |
          echo "=============== Pre-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "=================================================="
          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\\(s\\)|Thread\\(s\\) per core|Core\\(s\\) per socket|CPU max MHz"
          echo "=================================================="
          echo "[Memory]"
          free -h
          echo "=================================================="
          echo "[Disk]"
          df -hT
          echo "--------------------------------------------------"
          df -hi
          echo "=================================================="
          echo "[Workspace]"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          du -sh "${GITHUB_WORKSPACE}" 2>/dev/null || true
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true
          echo "=================================================="

      - name: Build Firmware
        env:
          ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: ./build.sh ${{ inputs.model }} ${{ inputs.build_mode }}

      - name: Verify Customizations
        run: |
          set +e
          ERRORS=0
          BUILD_DIR="./action_build"
          OVERLAY="$BUILD_DIR/package/base-files/files"

          echo "============================================"
          echo "  定制验证报告"
          echo "  模型: ${{ inputs.model }}"
          echo "============================================"

          # ── 0. 构建标记（主动上报，优先信任）──
          echo ""
          echo "■ [构建标记]"
          MARKS_DIR="$BUILD_DIR/.build_marks"
          if [ -d "$MARKS_DIR" ] && [ "$(ls -A "$MARKS_DIR" 2>/dev/null)" ]; then
            for mark in "$MARKS_DIR"/*; do
              name=$(basename "$mark")
              content=$(cat "$mark")
              status="${content%% *}"
              detail="${content#* }"
              [ "$detail" = "$content" ] && detail=""
              case "$status" in
                ok) echo "  ✅ $name${detail:+ — $detail}" ;;
                fail) echo "  ❌ $name${detail:+ — $detail}"; ERRORS=$((ERRORS + 1)) ;;
                *) echo "  ⚠️ $name — $content" ;;
              esac
            done
          else
            echo "  ⚠️ .build_marks 目录为空或不存在（构建脚本未上报，使用文件检查兜底）"
          fi

          # ── 1. LED 控制文件 ──
          echo ""
          echo "■ [LED控制]"
          check_file() {
            local path="$1" label="$2"
            if [ -f "$OVERLAY/$path" ]; then
              echo "  ✅ $label — $path"
            else
              echo "  ❌ $label — $path 未找到!"
              ERRORS=$((ERRORS + 1))
            fi
          }
          check_file "sbin/led-ctl"          "led-ctl CLI 调试工具"
          check_file "etc/init.d/led-ctrl"   "led-ctrl 互联网监测服务"
          check_file "etc/uci-defaults/994_led_config" "LED UCI 默认配置"

          # ── 2. UCI defaults 定制 ──
          echo ""
          echo "■ [UCI默认配置]"
          check_file "etc/uci-defaults/990_set_argon_primary"  "Argon 主题配置"
          check_file "etc/uci-defaults/991_custom_settings"    "系统级定制设置"
          check_file "etc/uci-defaults/992_set-wifi-uci.sh"    "WiFi 配置器"
          check_file "etc/uci-defaults/993_run-custom-boot-scripts" "自定义启动框架"

          # ── 3. 诊断脚本 ──
          echo ""
          echo "■ [诊断脚本]"
          for script in tempinfo cpuusage hnatusage nss_diag.sh; do
            found=$(find "$BUILD_DIR" -name "$script" -type f 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              echo "  ✅ $script — $(echo "$found" | sed "s|$BUILD_DIR/||")"
            else
              echo "  ⚠️  $script — 未找到（可能非本模型需要）"
            fi
          done

          # ── 3.5. HDSentinel ──
          echo ""
          echo "■ [HDSentinel]"
          HDS=$(find "$BUILD_DIR/files" -name "HDSentinel" -type f 2>/dev/null | head -1)
          if [ -n "$HDS" ] && [ -x "$HDS" ]; then
            echo "  ✅ HDSentinel — $(echo "$HDS" | sed "s|$BUILD_DIR/||") ($(stat -c%s "$HDS") bytes)"
          else
            echo "  ⚠️  HDSentinel — 未找到或不可执行（下载可能失败，已回退或跳过）"
          fi

          # ── 4. NN6000 DTS LED 极性修正 ──
          echo ""
          echo "■ [DTS修正 — NN6000 LED极性]"
          if echo "${{ inputs.model }}" | grep -qi "nn6000"; then
            # 4a. 独立验证 Link/NN6000 DTS
            NN_DTS=$(find "$BUILD_DIR/target/linux/qualcommax" \
              \( -name "*link*.dts" -o -name "*link*.dtsi" -o -name "*link*.patch" \
                 -o -name "*nn6000*.dts" -o -name "*nn6000*.dtsi" -o -name "*nn6000*.patch" \) \
              2>/dev/null | head -1)
            if [ -n "$NN_DTS" ]; then
              if grep -q "GPIO_ACTIVE_LOW" "$NN_DTS" 2>/dev/null; then
                echo "  ✅ NN6000 DTS 已修正为 GPIO_ACTIVE_LOW ($(echo "$NN_DTS" | sed "s|$BUILD_DIR/||"))"
              else
                echo "  ❌ NN6000 DTS 未修正！仍为 GPIO_ACTIVE_HIGH"
                ERRORS=$((ERRORS + 1))
              fi
            else
              echo "  ❌ 未找到 NN6000/Link DTS 文件"
              ERRORS=$((ERRORS + 1))
            fi
            # 4b. 独立误伤检查：非 Link/NN6000 文件的 status-red 节点是否被修改
            echo "  --- 误伤检查 ---"
            OTHER=$(find "$BUILD_DIR/target/linux/qualcommax" \
              \( -name "*.dts" -o -name "*.dtsi" -o -name "*.patch" \) \
              ! -name "*link*" ! -name "*nn6000*" ! -name "*NN6000*" \
              -exec grep -l "status-red" {} \; 2>/dev/null)
            if [ -n "$OTHER" ]; then
              echo "$OTHER" | while read -r f; do
                # 精确检查：仅提取 status-red 节点内 gpios 行，判断是否被改为 ACTIVE_LOW
                MOD=$(sed -n '/status-red {/,/};/{ /gpios =.*GPIO_ACTIVE_LOW/p; }' "$f" 2>/dev/null)
                if [ -n "$MOD" ]; then
                  echo "  ⚠️  $(basename "$f") LED 节点被修改: $(echo "$MOD" | tr -d '\n')"
                else
                  echo "  ✅ $(basename "$f") — LED 节点未被修改"
                fi
              done
            else
              echo "  — 无其他含 status-red 的文件"
            fi
          else
            echo "  — 非 NN6000 模型，跳过"
          fi

          # ── 5. 定制分支信息 ──
          echo ""
          echo "■ [定制分支信息行]"

          # 检查源文件（确认 set_build_signature 补丁已应用）
          JS_SOURCE=$(find "$BUILD_DIR/feeds/luci/modules/luci-mod-status" -name "10_system.js" 2>/dev/null | head -1)
          JS_BUILT=$(find "$BUILD_DIR/build_dir" -path "*/luci-mod-status*/htdocs/*/10_system.js" 2>/dev/null | head -1)

          if [ -n "$JS_SOURCE" ]; then
            if grep -q "_('Custom Branch')" "$JS_SOURCE" 2>/dev/null; then
              echo "  ✅ 源文件 — 包含 _('Custom Branch')"
            else
              echo "  ❌ 源文件 — 未找到 _('Custom Branch')"
              ERRORS=$((ERRORS + 1))
            fi
          else
            echo "  ❌ 源文件 — 10_system.js 未找到（set_build_signature 可能未执行）"
            ERRORS=$((ERRORS + 1))
          fi

          if [ -n "$JS_BUILT" ]; then
            if grep -q "_('Custom Branch')" "$JS_BUILT" 2>/dev/null; then
              echo "  ✅ 构建产物 — $(echo "$JS_BUILT" | sed "s|$BUILD_DIR/||") — 验证通过"
            else
              echo "  ❌ 构建产物 — _('Custom Branch') 未命中（可能被构建过程覆盖）"
              ERRORS=$((ERRORS + 1))
            fi
          else
            echo "  ⚠️  构建产物 — 未在 build_dir 中找到 luci-mod-status 副本（可能已清理）"
          fi

          # ImmortalWRT/LuCI 简体中文翻译目录为 po/zh_Hans/（兼容 zh-cn/zh_CN）
          PO_FILE=$(find "$BUILD_DIR/feeds/luci/modules/luci-mod-status/po" -type f -name "luci-mod-status.po" \( -path "*/zh_Hans/*" -o -path "*/zh-cn/*" -o -path "*/zh_CN/*" \) 2>/dev/null | head -1)
          if [ -n "$PO_FILE" ]; then
            if grep -q '"Custom Branch"' "$PO_FILE" && grep -q '"定制分支"' "$PO_FILE"; then
              echo "  ✅ zh_Hans .po — 已包含定制分支翻译 ($(basename "$(dirname "$PO_FILE")"))"
            else
              echo "  ❌ zh_Hans .po — 翻译条目不完整"
              ERRORS=$((ERRORS + 1))
            fi
          else
            echo "  ❌ zh_Hans .po — 未找到简体中文翻译（set_build_signature 注入失败）"
            ERRORS=$((ERRORS + 1))
          fi

          # ── 7. 补丁文件 ──
          echo ""
          echo "■ [补丁部署]"

          # 检查补丁文件是否存在于对应的 package patches 目录（确认注入成功）
          check_patch() {
            local patch_name="$1" search_dir="$2" label="$3"
            local found
            found=$(find "$search_dir" -name "$patch_name" 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              echo "  ✅ $label — $(echo "$found" | sed "s|$BUILD_DIR/||")"
            else
              echo "  ⚠️  $label — $patch_name 未在 $search_dir 中找到"
            fi
          }
          # ⭐ 本地定制：APK 模式下 opkg 不参与构建，跳过 opkg 补丁检查
          PKG_MGR=$(grep -E '^PACKAGE_MANAGER=' "wrt_core/compilecfg/${{ inputs.model }}.ini" 2>/dev/null | head -1 | cut -d= -f2)
          PKG_MGR=${PKG_MGR:-opkg}
          if [ "$PKG_MGR" = "apk" ]; then
            echo "  ⏭️  APK 模式 — 跳过 opkg 补丁检查"
          else
            check_patch "001-fix-provides-version-parsing.patch" \
              "$BUILD_DIR/feeds/packages/system/opkg/patches" "opkg Provides 版本解析修复"
          fi
          check_patch "100-smartdns-optimize.patch" \
            "$BUILD_DIR/feeds/packages/net/smartdns/patches" "smartdns 优化"
          check_patch "999-chanage-default-leaseduration.patch" \
            "$BUILD_DIR/feeds/packages/net/miniupnpd/patches" "miniupnpd 默认租期"

          # ── 8. 固件产物完整性 ──
          echo ""
          echo "■ [固件产物]"
          FW_COUNT=$(ls -1 ./firmware/*.* 2>/dev/null | wc -l)
          if [ "$FW_COUNT" -gt 0 ]; then
            echo "  ✅ 固件文件数: $FW_COUNT"
            ls -lh ./firmware/ 2>/dev/null | grep -v '^total' | while read line; do echo "    $line"; done
          else
            echo "  ⚠️  firmware/ 目录为空（调试模式可能不产生固件）"
          fi

          # ── 汇总 ──
          echo ""
          echo "============================================"
          if [ $ERRORS -eq 0 ]; then
            echo "  结果: ✅ 所有定制检查通过"
          else
            echo "  结果: ⚠️  $ERRORS 项检查未通过"
          fi
          echo "============================================"

      - name: Delete Old Cache
        run: |
          # 获取缓存列表并删除
          gh cache list --key ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          # 输出缓存状态
          echo "========cache status========"
          echo "ccache: $(du -sh ./action_build/.ccache | cut -f 1)"
          echo "staging: $(du -sh ./action_build/staging_dir | cut -f 1)"

      - name: Machine Information (Post-build)
        run: |
          echo "=============== Post-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "===================================================="
          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\\(s\\)|Thread\\(s\\) per core|Core\\(s\\) per socket|CPU max MHz"
          echo "===================================================="
          echo "[Memory]"
          free -h
          echo "===================================================="
          echo "[Disk]"
          df -hT
          echo "----------------------------------------------------"
          df -hi
          echo "===================================================="
          echo "[Build Outputs]"
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true
          echo "Firmware file count: $(ls -1 ./firmware 2>/dev/null | wc -l)"
          echo "===================================================="

      - name: List Firmware Files
        id: list-firmware
        run: |
          cd ./firmware
          files=$(find . -maxdepth 1 -type f 2>/dev/null | sed 's|^\./||' | sort | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "检测到固件文件: $files"

      # 中转：合并上传固件，供 upload-per-file job 下载后逐文件独立打包
      - name: Upload Firmware (transit)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.BUILD_DATE }}_${{ inputs.model }}
          path: ./firmware/*.*

      # ⭐ 本地定制：独立 IPK/APK 包随固件一起交付（包编入固件的同时，可单独 opkg 安装/升级）
      - name: Upload Independent Packages (IPK)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.BUILD_DATE }}_${{ inputs.model }}_packages
          path: ./firmware/packages
          if-no-files-found: warn

  # 每个固件文件独立打包为单独 artifact
  upload-per-file:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        file: ${{ fromJson(needs.build.outputs.firmware_files) }}
    steps:
      - name: Download Firmware
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.build_date }}_${{ inputs.model }}
          path: firmware
      - name: Upload Single Firmware
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.file }}
          path: ./firmware/${{ matrix.file }}
          if-no-files-found: error

  # 清理中转合并包（只保留各固件独立 artifact）
  cleanup:
    needs: [build, upload-per-file]
    runs-on: ubuntu-24.04
    steps:
      - name: Delete Transit Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          transit="${{ needs.build.outputs.build_date }}_${{ inputs.model }}"
          ids=$(gh api "repos/{owner}/{repo}/actions/artifacts" --jq ".artifacts[] | select(.name==\"$transit\") | .id" 2>/dev/null || true)
          if [ -n "$ids" ]; then
            for id in $ids; do
              echo "删除中转 artifact: $id"
              gh api -X DELETE "repos/{owner}/{repo}/actions/artifacts/$id" || true
            done
          fi
