name: Release WRT
run-name: Release - ${{ inputs.model }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: jdcloud_ipq60xx_immwrt
        options:
          - aliyun_ap8220_immwrt
          - aliyun_ap8220_libwrt
          - cmcc_rax3000m_immwrt
          - gemtek_w1701k_immwrt
          - jdcloud_ax6000_immwrt
          - jdcloud_ipq60xx_immwrt
          - jdcloud_ipq60xx_libwrt
          - link_nn6000v2_immwrt
          - linksys_mx4x00_immwrt
          # - n1_immwrt
          - qihoo_360v6_immwrt
          - redmi_ax5_immwrt
          - redmi_ax6_immwrt
          - redmi_ax6_libwrt
          - redmi_ax6000_immwrt21
          - zn_m2_immwrt
          - zn_m2_libwrt
          - x64_immwrt
      add_fragments:
        required: false
        description: Add config fragments, comma separated
        default: ""
      remove_fragments:
        required: false
        description: Remove default config fragments, comma separated
        default: ""

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo -E apt-get autoremove --purge -y || true
          sudo -E apt-get clean || true
          df -hT

      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev binutils 7zip
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set Build Date and Timezone
        env:
          RAW_ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          RAW_REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: |
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          sanitize_cache_key_part() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.-' '_'; }
          echo "ADD_CONFIG_FRAGMENTS_KEY=$(sanitize_cache_key_part "$RAW_ADD_CONFIG_FRAGMENTS")" >> $GITHUB_ENV
          echo "REMOVE_CONFIG_FRAGMENTS_KEY=$(sanitize_cache_key_part "$RAW_REMOVE_CONFIG_FRAGMENTS")" >> $GITHUB_ENV
          export BUILD_SRC=$(awk -F"=" '/REPO_URL/ {print $NF}' "./wrt_core/compilecfg/${{ inputs.model }}.ini")
          echo "BUILD_SRC=$BUILD_SRC" >> $GITHUB_ENV

      - name: Pre Clone
        run: ./wrt_core/pre_clone_action.sh ${{ inputs.model }}

      - name: Cache Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}-${{ env.ADD_CONFIG_FRAGMENTS_KEY }}-${{ env.REMOVE_CONFIG_FRAGMENTS_KEY }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}-${{ env.ADD_CONFIG_FRAGMENTS_KEY }}-${{ env.REMOVE_CONFIG_FRAGMENTS_KEY }}-
            ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}-

      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Machine Information (Pre-build)
        run: |
          echo "=============== Pre-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "=================================================="
          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\\(s\\)|Thread\\(s\\) per core|Core\\(s\\) per socket|CPU max MHz"
          echo "=================================================="
          echo "[Memory]"
          free -h
          echo "=================================================="
          echo "[Disk]"
          df -hT
          echo "--------------------------------------------------"
          df -hi
          echo "=================================================="
          echo "[Workspace]"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          du -sh "${GITHUB_WORKSPACE}" 2>/dev/null || true
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true
          echo "=================================================="

      - name: Build Firmware
        env:
          ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: ./build.sh ${{ inputs.model }}

      - name: Verify Customizations
        run: |
          set +e
          ERRORS=0
          BUILD_DIR="./action_build"
          OVERLAY="$BUILD_DIR/package/base-files/files"

          echo "============================================"
          echo "  定制验证报告"
          echo "  模型: ${{ inputs.model }}"
          echo "============================================"

          # ── 0. 构建标记（主动上报，优先信任）──
          echo ""
          echo "■ [构建标记]"
          MARKS_DIR="$BUILD_DIR/.build_marks"
          if [ -d "$MARKS_DIR" ] && [ "$(ls -A "$MARKS_DIR" 2>/dev/null)" ]; then
            for mark in "$MARKS_DIR"/*; do
              name=$(basename "$mark")
              content=$(cat "$mark")
              status="${content%% *}"
              detail="${content#* }"
              [ "$detail" = "$content" ] && detail=""
              case "$status" in
                ok) echo "  ✅ $name${detail:+ — $detail}" ;;
                fail) echo "  ❌ $name${detail:+ — $detail}"; ERRORS=$((ERRORS + 1)) ;;
                *) echo "  ⚠️ $name — $content" ;;
              esac
            done
          else
            echo "  ⚠️ .build_marks 目录为空或不存在（构建脚本未上报，使用文件检查兜底）"
          fi

          # ── 1. LED 控制文件 ──
          echo ""
          echo "■ [LED控制]"
          check_file() {
            local path="$1" label="$2"
            if [ -f "$OVERLAY/$path" ]; then
              echo "  ✅ $label — $path"
            else
              echo "  ❌ $label — $path 未找到!"
              ERRORS=$((ERRORS + 1))
            fi
          }
          check_file "sbin/led-ctl"          "led-ctl CLI 调试工具"
          check_file "etc/init.d/led-ctrl"   "led-ctrl 互联网监测服务"
          check_file "etc/uci-defaults/994_led_config" "LED UCI 默认配置"

          # ── 2. UCI defaults 定制 ──
          echo ""
          echo "■ [UCI默认配置]"
          check_file "etc/uci-defaults/990_set_argon_primary"  "Argon 主题配置"
          check_file "etc/uci-defaults/991_custom_settings"    "系统级定制设置"
          check_file "etc/uci-defaults/992_set-wifi-uci.sh"    "WiFi 配置器"
          check_file "etc/uci-defaults/993_run-custom-boot-scripts" "自定义启动框架"

          # ── 3. 诊断脚本 ──
          echo ""
          echo "■ [诊断脚本]"
          for script in tempinfo cpuusage hnatusage nss_diag.sh; do
            found=$(find "$BUILD_DIR" -name "$script" -type f 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              echo "  ✅ $script — $(echo "$found" | sed "s|$BUILD_DIR/||")"
            else
              echo "  ⚠️  $script — 未找到（可能非本模型需要）"
            fi
          done

          # ── 3.5. HDSentinel ──
          echo ""
          echo "■ [HDSentinel]"
          HDS=$(find "$BUILD_DIR/files" -name "HDSentinel" -type f 2>/dev/null | head -1)
          if [ -n "$HDS" ] && [ -x "$HDS" ]; then
            echo "  ✅ HDSentinel — $(echo "$HDS" | sed "s|$BUILD_DIR/||") ($(stat -c%s "$HDS") bytes)"
          else
            echo "  ⚠️  HDSentinel — 未找到或不可执行（下载可能失败，已回退或跳过）"
          fi

          # ── 4. NN6000 DTS LED 极性修正 ──
          echo ""
          echo "■ [DTS修正 — NN6000 LED极性]"
          if echo "${{ inputs.model }}" | grep -qi "nn6000"; then
            # 4a. 独立验证 Link/NN6000 DTS
            NN_DTS=$(find "$BUILD_DIR/target/linux/qualcommax" \
              \( -name "*link*.dts" -o -name "*link*.dtsi" -o -name "*link*.patch" \
                 -o -name "*nn6000*.dts" -o -name "*nn6000*.dtsi" -o -name "*nn6000*.patch" \) \
              2>/dev/null | head -1)
            if [ -n "$NN_DTS" ]; then
              if grep -q "GPIO_ACTIVE_LOW" "$NN_DTS" 2>/dev/null; then
                echo "  ✅ NN6000 DTS 已修正为 GPIO_ACTIVE_LOW ($(echo "$NN_DTS" | sed "s|$BUILD_DIR/||"))"
              else
                echo "  ❌ NN6000 DTS 未修正！仍为 GPIO_ACTIVE_HIGH"
                ERRORS=$((ERRORS + 1))
              fi
            else
              echo "  ❌ 未找到 NN6000/Link DTS 文件"
              ERRORS=$((ERRORS + 1))
            fi
            # 4b. 独立误伤检查：非 Link/NN6000 文件的 status-red 节点是否被修改
            echo "  --- 误伤检查 ---"
            OTHER=$(find "$BUILD_DIR/target/linux/qualcommax" \
              \( -name "*.dts" -o -name "*.dtsi" -o -name "*.patch" \) \
              ! -name "*link*" ! -name "*nn6000*" ! -name "*NN6000*" \
              -exec grep -l "status-red" {} \; 2>/dev/null)
            if [ -n "$OTHER" ]; then
              echo "$OTHER" | while read -r f; do
                # 精确检查：仅提取 status-red 节点内 gpios 行，判断是否被改为 ACTIVE_LOW
                MOD=$(sed -n '/status-red {/,/};/{ /gpios =.*GPIO_ACTIVE_LOW/p; }' "$f" 2>/dev/null)
                if [ -n "$MOD" ]; then
                  echo "  ⚠️  $(basename "$f") LED 节点被修改: $(echo "$MOD" | tr -d '\n')"
                else
                  echo "  ✅ $(basename "$f") — LED 节点未被修改"
                fi
              done
            else
              echo "  — 无其他含 status-red 的文件"
            fi
          else
            echo "  — 非 NN6000 模型，跳过"
          fi

          # ── 5. 补丁文件 ──
          echo ""
          echo "■ [补丁部署]"
          for patch in 001-fix-provides-version-parsing.patch 100-smartdns-optimize.patch 999-chanage-default-leaseduration.patch; do
            found=$(find "$BUILD_DIR" -name "$patch" 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              echo "  ✅ $patch — 已部署"
            else
              echo "  ⚠️  $patch — 未在构建树中找到"
            fi
          done

          # ── 6. 预编译 IPK ──
          echo ""
          echo "■ [预编译IPK]"
          PREBUILT_COUNT=$(ls -1 "./wrt_core/prebuilt_packages/pkgs/"*.ipk 2>/dev/null | wc -l)
          if [ "$PREBUILT_COUNT" -gt 0 ]; then
            echo "  ✅ $PREBUILT_COUNT 个预编译 IPK 可用"
          else
            echo "  ⚠️  无预编译 IPK"
          fi

          # ── 7. 固件产物完整性 ──
          echo ""
          echo "■ [固件产物]"
          FW_COUNT=$(ls -1 ./firmware/*.* 2>/dev/null | wc -l)
          if [ "$FW_COUNT" -gt 0 ]; then
            echo "  ✅ 固件文件数: $FW_COUNT"
            ls -lh ./firmware/ 2>/dev/null | grep -v '^total' | while read line; do echo "    $line"; done
          else
            echo "  ⚠️  firmware/ 目录为空（调试模式可能不产生固件）"
          fi

          # ── 汇总 ──
          echo ""
          echo "============================================"
          if [ $ERRORS -eq 0 ]; then
            echo "  结果: ✅ 所有定制检查通过"
          else
            echo "  结果: ⚠️  $ERRORS 项检查未通过"
          fi
          echo "============================================"

      - name: Get Kernel Verion
        run: |
          # 获取内核版本
          echo "KVER=$(grep -oP "^kernel.*" ./firmware/*.manifest | grep -oP "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}")" >> $GITHUB_ENV

      - name: Delete Old Cache
        run: |
          # 获取缓存列表并删除
          gh cache list --key ${{ matrix.os }}-${{ inputs.model }}-${{ hashFiles('**/repo_flag') }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          # 输出缓存状态
          echo "========cache status========"
          echo "ccache: $(du -sh ./action_build/.ccache | cut -f 1)"
          echo "staging: $(du -sh ./action_build/staging_dir | cut -f 1)"

      - name: Machine Information (Post-build)
        run: |
          echo "=============== Post-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "===================================================="
          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\\(s\\)|Thread\\(s\\) per core|Core\\(s\\) per socket|CPU max MHz"
          echo "===================================================="
          echo "[Memory]"
          free -h
          echo "===================================================="
          echo "[Disk]"
          df -hT
          echo "----------------------------------------------------"
          df -hi
          echo "===================================================="
          echo "[Build Outputs]"
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true
          echo "Firmware file count: $(ls -1 ./firmware 2>/dev/null | wc -l)"
          echo "===================================================="

      - name: Package Kmods
        run: |
          if [ ! -d "./action_build/bin" ]; then
            echo "kmod source directory not found: ./action_build/bin" >&2
            exit 1
          fi

          KMOD_LIST=$(mktemp)
          trap 'rm -f "$KMOD_LIST"' EXIT

          (
            cd ./action_build/bin
            find . -type f \( -name "kmod*.ipk" -o -name "kmod*.apk" \) -print | sort > "$KMOD_LIST"
          )

          if [ ! -s "$KMOD_LIST" ]; then
            echo "No kmod packages found under ./action_build/bin" >&2
            exit 1
          fi

          kmod_count=$(wc -l < "$KMOD_LIST" | tr -d '[:space:]')
          archive_name="kmods_${{ inputs.model }}_${KVER:-unknown-kernel}_${BUILD_DATE}.tar.gz"
          tar -C ./action_build/bin -czf "$archive_name" -T "$KMOD_LIST"

          echo "KMOD_ARCHIVE=$archive_name" >> "$GITHUB_ENV"
          echo "Packaged $kmod_count kmod packages into $archive_name"

      # - name: Package OpenWrt Firmware (N1专用)
      #   if: ${{ inputs.model == 'n1_immwrt' }}
      #   uses: unifreq/openwrt_packit@8007d3efd49bb42aa20c5755a50af21dc7a438e1
      #   env:
      #     OPENWRT_ARMVIRT: firmware/*.tar.gz
      #     PACKAGE_SOC: s905d
      #     KERNEL_VERSION_NAME: 6.6.y
      #     WHOAMI: ZqinKing

      - name: Prepare Release Body
        run: |
          echo "云编译发布" > release_body.txt
          echo "源码：${{ env.BUILD_SRC }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "WIFI密码: 12345678" >> release_body.txt
          echo "LAN地址: 192.168.1.1" >> release_body.txt
          echo "KMOD归档: ${KMOD_ARCHIVE}" >> release_body.txt
          echo "插件：" >> release_body.txt
          echo "$(grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest | awk -F":" '{print $NF}')"  >> release_body.txt

      - name: Release Firmware
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ inputs.model }}
          files: |
            # ${{ inputs.model == 'n1_immwrt' && env.PACKAGED_OUTPUTPATH || './firmware' }}/*.*
            ./firmware/*.*
            ./kmods_*.tar.gz
          fail_on_unmatched_files: true
          body_path: ./release_body.txt
